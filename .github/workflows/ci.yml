name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore
      - run: dotnet restore Uinsure.slnx --locked-mode
      - run: dotnet format Uinsure.slnx --verify-no-changes --no-restore
      - run: dotnet build Uinsure.slnx --configuration Release --no-restore
      - run: dotnet test Uinsure.slnx --configuration Release --no-build --logger trx --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-test-results
          path: TestResults/*.trx
          if-no-files-found: error
          retention-days: 7
